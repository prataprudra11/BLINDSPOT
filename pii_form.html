<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Demo Portal — PII Verification Form</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #131b2e;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #10b981;
      --border: #23314d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }
    .form-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
      width: 100%;
      max-width: 600px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    .banner-warning {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #f87171;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 24px;
    }
    .profile-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
    }
    .face-avatar {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: #1e293b;
      border: 2px solid var(--primary);
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
    input, textarea {
      width: 100%;
      padding: 10px 12px;
      background: #090d16;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 13px;
      outline: none;
    }
    input:focus, textarea:focus { border-color: var(--primary); }
    button {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <div class="form-card">
    <div class="banner-warning">
      🔒 <strong>PRIVACY FIREWALL DEMO:</strong> All inputs on this page contain synthetic dummy values. Test that local perception redacts name, email, phone, PAN, Aadhaar, and credit card fields.
    </div>

    <div class="profile-header">
      <svg class="face-avatar" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="45" fill="#334155" />
        <circle cx="50" cy="38" r="18" fill="#94a3b8" />
        <path d="M 20 82 Q 50 55 80 82 Z" fill="#94a3b8" />
      </svg>
      <div>
        <h3>Synthetic User Identity</h3>
        <p style="font-size: 12px; color: #94a3b8;">Profile ID: SYN-883921</p>
      </div>
    </div>

    <form onsubmit="event.preventDefault(); alert('PII Form Submitted (Synthetic)!');">
      <div class="grid-2">
        <div class="form-group">
          <label for="full-name">Full Name</label>
          <input type="text" id="full-name" name="name" value="Jane Doe Synthetic" />
        </div>
        <div class="form-group">
          <label for="email-addr">Email Address</label>
          <input type="email" id="email-addr" name="email" value="jane.doe@synthetic-test.org" />
        </div>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label for="phone-num">Phone Number</label>
          <input type="tel" id="phone-num" name="phone" value="+91 98765 43210" />
        </div>
        <div class="form-group">
          <label for="pass-field">Account Password</label>
          <input type="password" id="pass-field" name="password" value="SuperSecretDemoPass99!" />
        </div>
      </div>

      <div class="form-group">
        <label for="res-address">Residential Address</label>
        <textarea id="res-address" name="address" rows="2">123 Synthetic Tech Park, Block B, New Delhi, India</textarea>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label for="pan-card">Synthetic PAN Card Number</label>
          <input type="text" id="pan-card" name="pan" value="ABCDE1234F" />
        </div>
        <div class="form-group">
          <label for="aadhaar-card">Synthetic Aadhaar Number</label>
          <input type="text" id="aadhaar-card" name="aadhaar" value="2345-6789-0123" />
        </div>
      </div>

      <div class="form-group">
        <label for="credit-card">Synthetic Credit Card</label>
        <input type="text" id="credit-card" name="card" value="4532-0151-1283-0366" />
      </div>

      <button type="submit" id="btn-submit-pii">Submit Verified Profile</button>
    </form>
  </div>
</body>
</html>

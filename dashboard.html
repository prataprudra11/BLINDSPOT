<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Demo Portal — Login</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #151c2c;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --border: #2e3b52;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .login-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    .badge-demo {
      display: inline-block;
      background: rgba(245, 158, 11, 0.15);
      color: #f59e0b;
      border: 1px solid rgba(245, 158, 11, 0.3);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      margin-bottom: 16px;
    }
    h2 { font-size: 22px; margin-bottom: 8px; }
    p { color: var(--text-muted); font-size: 14px; margin-bottom: 24px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 6px; }
    input[type="email"], input[type="password"] {
      width: 100%;
      padding: 12px 14px;
      background: #0b0f19;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 14px;
      outline: none;
    }
    input:focus { border-color: var(--primary); }
    .checkbox-group { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-muted); margin-bottom: 24px; }
    button {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: var(--primary-hover); }
  </style>
</head>
<body>
  <div class="login-card">
    <span class="badge-demo">⚠️ SYNTHETIC DEMO PAGE</span>
    <h2>Sign in to Account</h2>
    <p>Test Privacy Firewall perception on login inputs</p>
    
    <form onsubmit="event.preventDefault(); alert('Login attempt caught in demo!');">
      <div class="form-group">
        <label for="email-input">Email Address</label>
        <input type="email" id="email-input" name="email" placeholder="user@synthetic-demo.internal" value="demo.user@test.org" autocomplete="email" />
      </div>

      <div class="form-group">
        <label for="password-input">Password</label>
        <input type="password" id="password-input" name="password" placeholder="••••••••••••" value="SyntheticDemoSecret123!" autocomplete="current-password" />
      </div>

      <div class="checkbox-group">
        <input type="checkbox" id="remember-me" name="remember" />
        <label for="remember-me">Remember this device</label>
      </div>

      <button type="submit" id="btn-login">Sign In</button>
    </form>
  </div>
</body>
</html>

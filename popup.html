<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Agent Assistant</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="extension-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="logo-orb"></div>
        <div>
          <h1 class="title">Agent Control</h1>
          <p class="subtitle">Manifest V3 Skeleton</p>
        </div>
      </div>
      <div id="statusBadge" class="status-badge status-idle">
        <span class="status-dot"></span>
        <span id="statusText">Idle</span>
      </div>
    </header>

    <!-- Goal Form -->
    <main class="main-content">
      <div class="input-group">
        <label for="taskGoal" class="label">Task Goal</label>
        <textarea
          id="taskGoal"
          class="goal-input"
          rows="3"
          placeholder="e.g. Find pricing plans on this page..."
        >Verify message passing to server and content script</textarea>
      </div>

      <div class="button-row">
        <button id="startBtn" class="btn btn-primary">
          <span class="btn-text">Start Agent</span>
          <span class="btn-loader hidden" id="btnSpinner"></span>
        </button>
        <button id="pingServerBtn" class="btn btn-secondary" title="Test server connection">
          Ping Server
        </button>
      </div>

      <!-- Loop Telemetry Card -->
      <div id="loopTelemetry" class="telemetry-card">
        <div class="telemetry-row">
          <span class="telemetry-label">Loop Step:</span>
          <span id="telemetryStep" class="telemetry-val">0 / 10</span>
        </div>
        <div class="telemetry-row">
          <span class="telemetry-label">Last Action:</span>
          <span id="telemetryAction" class="telemetry-val">None</span>
        </div>
        <div id="telemetryRejectionBox" class="telemetry-rejection hidden">
          <span class="rejection-label">⚠️ Validator Rejection:</span>
          <span id="telemetryRejection" class="rejection-val"></span>
        </div>
      </div>

      <!-- Phase 4: Visual Redaction Before/After Audit Card -->
      <div id="visualAuditCard" class="telemetry-card visual-audit-card hidden">
        <div class="telemetry-row">
          <span class="telemetry-label">👁️ Visual Redaction Audit:</span>
          <span id="visualAuditTarget" class="telemetry-val">None</span>
        </div>
        <div class="visual-audit-thumbnails">
          <div class="thumb-box">
            <span class="thumb-caption">Original</span>
            <img id="thumbOriginal" class="audit-thumb" src="" alt="Original Preview" />
          </div>
          <div class="thumb-arrow">→</div>
          <div class="thumb-box">
            <span class="thumb-caption">Redacted</span>
            <img id="thumbRedacted" class="audit-thumb" src="" alt="Redacted Preview" />
          </div>
        </div>
        <div id="visualBadgeContainer" class="visual-badge-row"></div>
      </div>

      <!-- Logs / Status Area -->
      <section class="logs-section">
        <div class="logs-header">
          <span class="logs-title">System & Event Logs</span>
          <button id="clearLogsBtn" class="btn-text-link">Clear</button>
        </div>
        <div id="logsConsole" class="logs-console" role="log" aria-live="polite">
          <div class="log-entry log-system">
            <span class="log-time">[Init]</span>
            <span class="log-msg">Popup UI loaded. Ready to dispatch messages.</span>
          </div>
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <span class="endpoint-indicator">Server: <code>http://localhost:3000</code></span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
